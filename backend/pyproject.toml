[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend sidecar for reg-onsite-ui"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
